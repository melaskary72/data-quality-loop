# Vendor vocabulary to induced leaf.
# Derived from public vendor label strings plus the induced taxonomy.
# Never derived from ground truth, so QA may use it without leaking.
# A null mapping means no induced leaf covers that vendor label, and
# those tickets are excluded from agreement statistics and counted
# separately.

alignment:
  api_integration_error: "integration_api_failure"
  data_export_request: null
  data_sync_error: "integration_api_failure"
  feature_request: "feature_request"
  how_to_question: "product_howto_question"
  invoice_dispute: "billing_discrepancy"
  login_auth_failure: null
  performance_degradation: "performance_degradation"
  permissions_rbac: "role_permission_mismatch"
  plan_change: "plan_tier_management"
  refund_request: "refund_request"
  user_provisioning: "user_provisioning_failure"
reasoning:
  api_integration_error: "Directly matches failures in API/webhook/connector integrations as defined in integration_api_failure."
  data_export_request: "No induced leaf specifically covers data export requests; it doesn't fit performance, integration, or how-to/feature categories cleanly."
  data_sync_error: "Sync errors involving connectors or external systems align with the integration_api_failure leaf's description of data-sync integration failures."
  feature_request: "Direct semantic match: explicit proposals for new functionality not yet supported."
  how_to_question: "Matches informational/setup questions about existing documented features with no defect reported."
  invoice_dispute: "Disputing invoice accuracy or charges without requesting a refund matches billing_discrepancy exactly."
  login_auth_failure: "This vendor label spans multiple distinct induced leaves (sso_login_loop, account_lockout, mfa_delivery_failure, password_reset_failure) with no single leaf covering all login/auth failure types generically."
  performance_degradation: "Direct match for reports of slowness, hanging, or timeouts in core product surfaces."
  permissions_rbac: "Role-based access control issues where actual access diverges from assigned role match role_permission_mismatch."
  plan_change: "Requests to change subscription tier or seat count directly match plan_tier_management."
  refund_request: "Direct match: explicit ask for refund or credit as remedy for a billing problem."
  user_provisioning: "Automated account creation/sync pipeline failures (e.g., SCIM, bulk import) match user_provisioning_failure."
